# Publish @sonnetics/core to npm on tag push.
#
# Auth: npm Trusted Publishing (OIDC). No NPM_TOKEN required.
#   Configure once at npmjs.com -> @sonnetics/core -> Settings -> Trusted Publishing:
#     Owner: sonnetics, Repo: sonnetics-core, Workflow: publish-npm.yml
#
# Provenance (--provenance) requires this GitHub repository to be public.
# Publish will fail with E422 until the repo visibility is changed.
#
# Release: ./release.sh  (bumps, commits, tags, pushes)

name: Publish to npm

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to publish (e.g. v0.0.1-beta.16)"
                required: true

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  registry-url: https://registry.npmjs.org

            - uses: dtolnay/rust-toolchain@stable

            - name: Install wasm-pack
              run: cargo install wasm-pack

            - name: Build WASM
              run: wasm-pack build --target web --out-dir pkg

            - name: Verify WASM output
              run: test -f pkg/sonnetics_core_bg.wasm || (echo "WASM build failed" && exit 1)

            - name: Copy canonical package.json and sync version
              run: |
                  cp package.json pkg/package.json
                  VERSION=$(grep '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
                  sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" pkg/package.json

            - name: Set package name
              run: 'sed -i ''s|"name": "sonnetics-core"|"name": "@sonnetics/core"|'' pkg/package.json'

            - name: Publish to npm
              working-directory: pkg
              run: npm publish --tag beta --access public --provenance
