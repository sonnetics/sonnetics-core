# Build and publish sonnetics-core to PyPI on tag push.
#
# Setup (Trusted Publishing):
#   1. Create project "sonnetics-core" on pypi.org
#   2. Add GitHub as trusted publisher (owner, repo, workflow, environment: pypi)
#   3. Create GitHub environment "pypi"
#
# Release: ./release.sh  (bumps, commits, tags, pushes)

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --compatibility pypi ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.9' && '--sdist' || '' }}
          manylinux: 2014

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'macos-latest' && 'macos' || 'windows' }}-py${{ matrix.python-version }}
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
