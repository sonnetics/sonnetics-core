[package]
name = "sonnetics-core"
version = "0.0.1-beta.15"
edition = "2021"
description = "Wake-word detection library."
license = "Apache-2.0"
repository = "https://github.com/sonnetics/sonnetics-core"
documentation = "https://sonnetics.com/documentation/rust"
homepage = "https://sonnetics.com"
readme = "README.md"
keywords = ["wake-word", "voice", "voice-command", "speech", "audio"]
categories = ["multimedia::audio", "science"]

[features]
default = []
python = ["dep:pyo3"]

[lib]
name = "sonnetics_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mel_spec = { version = "0.3", features = ["wasm"] }
ndarray = "0.16"
resampler = "0.4"
tract-onnx = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pyo3 = { version = "0.28", features = ["extension-module"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
flate2 = "1.0"
hound = "3.5"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
tar = "0.4"
tempfile = "3.14"

[[example]]
name = "run"
path = "examples/run.rs"
