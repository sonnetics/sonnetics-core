[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "sonnetics-core"
version = "0.0.1-beta.13"
description = "Wake-word detection library."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9,<=3.14"
keywords = ["wake-word", "voice", "voice command", "speech", "audio"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://sonnetics.com"
Documentation = "https://sonnetics.com/documentation/rust"
Repository = "https://github.com/sonnetics/sonnetics-core"
Issues = "https://github.com/sonnetics/sonnetics-core/issues"

[tool.maturin]
module-name = "sonnetics_core"
manylinux = "2014"
features = ["python"]
